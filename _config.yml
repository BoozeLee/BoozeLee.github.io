title: "Terminal221B — BoozeLee"
description: "Sovereign AI Infrastructure · Security Research · Web3 · Open Source · Hasselt, Belgium"
url: "https://boozlee.github.io"
baseurl: ""
author:
  name: "Kiliaan Vanvoorden"
  email: "kiliaanv2@gmail.com"
  github: "BoozeLee"
  sponsors: "https://github.com/sponsors/BoozeLee"

# GitHub Pages — pure HTML, no Jekyll theme needed for index.html
# Keep remote_theme for markdown pages
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "air"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"

social:
  links:
    - "https://github.com/BoozeLee"
    - "https://github.com/sponsors/BoozeLee"

twitter:
  username: BoozeLee

exclude:
  - "*.sh"
  - "generate_docs.sh"
  - "SYSTEM_PROMPT.md"
  - "RESEARCH_CURE_CANCER_PLAN.md"
